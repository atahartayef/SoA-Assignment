<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#23201f"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#75706c"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8a2846"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f6f5c"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a2560d"/></marker><marker id="arrow-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#55611f"/></marker></defs>
<rect width="880" height="580" fill="white"/>
<rect x="0" y="0" width="880" height="580" rx="2" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="440" y="24" font-size="12.5" text-anchor="middle" fill="#75706c" font-style="italic">Nobody is in charge: each service reacts to what happened and publishes what it decided.</text>
<text x="24" y="62" font-size="12.5" text-anchor="start" fill="#23201f" font-weight="bold">the order completes</text>
<rect x="24" y="74" width="120" height="56" rx="2" fill="#ffffff" stroke="#8a2846" stroke-width="1.5"/>
<text x="84.0" y="97" font-size="12" text-anchor="middle" fill="#8a2846" font-weight="bold">Order</text>
<text x="84.0" y="114" font-size="10" text-anchor="middle" fill="#75706c">writes the order,</text>
<text x="84.0" y="127" font-size="10" text-anchor="middle" fill="#75706c">answers 201</text>
<line x1="146" y1="102" x2="250" y2="102" stroke="#1f6f5c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="198.0" y="94" font-size="9.8" text-anchor="middle" fill="#1f6f5c">order.placed</text>
<rect x="252" y="74" width="120" height="56" rx="2" fill="#ffffff" stroke="#8a2846" stroke-width="1.5"/>
<text x="312.0" y="97" font-size="12" text-anchor="middle" fill="#8a2846" font-weight="bold">Inventory</text>
<text x="312.0" y="114" font-size="10" text-anchor="middle" fill="#75706c">holds the stock</text>
<text x="312.0" y="127" font-size="10" text-anchor="middle" fill="#75706c">(try)</text>
<line x1="374" y1="102" x2="478" y2="102" stroke="#1f6f5c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="426.0" y="94" font-size="9.8" text-anchor="middle" fill="#1f6f5c">inventory.reserved</text>
<rect x="480" y="74" width="120" height="56" rx="2" fill="#ffffff" stroke="#8a2846" stroke-width="1.5"/>
<text x="540.0" y="97" font-size="12" text-anchor="middle" fill="#8a2846" font-weight="bold">Payment</text>
<text x="540.0" y="114" font-size="10" text-anchor="middle" fill="#75706c">asks the card</text>
<text x="540.0" y="127" font-size="10" text-anchor="middle" fill="#75706c">provider</text>
<line x1="602" y1="102" x2="706" y2="102" stroke="#1f6f5c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="654.0" y="94" font-size="9.8" text-anchor="middle" fill="#1f6f5c">payment.authorised</text>
<rect x="708" y="74" width="148" height="56" rx="2" fill="#ffffff" stroke="#8a2846" stroke-width="1.5"/>
<text x="782.0" y="97" font-size="12" text-anchor="middle" fill="#8a2846" font-weight="bold">Order → CONFIRMED</text>
<text x="782.0" y="114" font-size="10" text-anchor="middle" fill="#75706c">publishes order.confirmed</text>
<polyline points="782,130 782,152 312,152 312,172" fill="none" stroke="#1f6f5c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="548" y="146" font-size="9.8" text-anchor="middle" fill="#1f6f5c">order.confirmed</text>
<rect x="252" y="172" width="120" height="56" rx="2" fill="#ffffff" stroke="#8a2846" stroke-width="1.5"/>
<text x="312.0" y="195" font-size="12" text-anchor="middle" fill="#8a2846" font-weight="bold">Inventory</text>
<text x="312.0" y="212" font-size="10" text-anchor="middle" fill="#75706c">deducts the stock</text>
<text x="312.0" y="225" font-size="10" text-anchor="middle" fill="#75706c">(confirm)</text>
<polyline points="782,130 782,172" fill="none" stroke="#1f6f5c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<rect x="708" y="172" width="148" height="56" rx="2" fill="#ffffff" stroke="#23201f" stroke-width="1.5"/>
<text x="782.0" y="195" font-size="12" text-anchor="middle" fill="#23201f" font-weight="bold">Notification</text>
<text x="782.0" y="212" font-size="10" text-anchor="middle" fill="#75706c">records the e-mail</text>
<rect x="24" y="246" width="832" height="128" rx="2" fill="#fdf2f5" stroke="#8a2846" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="40" y="268" font-size="12.5" text-anchor="start" fill="#8a2846" font-weight="bold">the card is declined — the saga is undone, step by step</text>
<rect x="40" y="284" width="128" height="56" rx="2" fill="#ffffff" stroke="#8a2846" stroke-width="1.5"/>
<text x="104.0" y="307" font-size="12" text-anchor="middle" fill="#8a2846" font-weight="bold">Payment</text>
<text x="104.0" y="324" font-size="10" text-anchor="middle" fill="#75706c">declines, publishes</text>
<line x1="170" y1="312" x2="262" y2="312" stroke="#1f6f5c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="216.0" y="304" font-size="9.8" text-anchor="middle" fill="#1f6f5c">payment.declined</text>
<rect x="264" y="284" width="128" height="56" rx="2" fill="#ffffff" stroke="#8a2846" stroke-width="1.5"/>
<text x="328.0" y="307" font-size="12" text-anchor="middle" fill="#8a2846" font-weight="bold">Inventory</text>
<text x="328.0" y="324" font-size="10" text-anchor="middle" fill="#75706c">hands the hold back</text>
<text x="328.0" y="337" font-size="10" text-anchor="middle" fill="#75706c">(cancel)</text>
<line x1="394" y1="312" x2="486" y2="312" stroke="#1f6f5c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="440.0" y="304" font-size="9.8" text-anchor="middle" fill="#1f6f5c">inventory.released</text>
<rect x="488" y="284" width="128" height="56" rx="2" fill="#ffffff" stroke="#8a2846" stroke-width="1.5"/>
<text x="552.0" y="307" font-size="12" text-anchor="middle" fill="#8a2846" font-weight="bold">Order → CANCELLED</text>
<text x="552.0" y="324" font-size="10" text-anchor="middle" fill="#75706c">publishes order.cancelled</text>
<line x1="618" y1="312" x2="710" y2="312" stroke="#1f6f5c" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="664.0" y="304" font-size="9.8" text-anchor="middle" fill="#1f6f5c">order.cancelled</text>
<rect x="712" y="284" width="128" height="56" rx="2" fill="#ffffff" stroke="#23201f" stroke-width="1.5"/>
<text x="776.0" y="307" font-size="12" text-anchor="middle" fill="#23201f" font-weight="bold">Notification</text>
<text x="776.0" y="324" font-size="10" text-anchor="middle" fill="#75706c">tells the customer</text>
<text x="440" y="360" font-size="11" text-anchor="middle" fill="#75706c" font-style="italic">nothing is rolled back: every undo is an ordinary, idempotent operation that is itself an event</text>
<rect x="24" y="392" width="832" height="46" rx="2" fill="#e7f3f0" stroke="#1f6f5c" stroke-width="1.7"/>
<text x="440" y="414" font-size="13" text-anchor="middle" fill="#1f6f5c" font-weight="bold">every arrow above is one message on NATS JetStream, stream MALTASHOP, subject maltashop.&gt;</text>
<text x="440" y="431" font-size="11" text-anchor="middle" fill="#75706c">no service calls another service; each has one durable consumer and reads at its own pace</text>
<rect x="24" y="458" width="404" height="110" rx="2" fill="#ffffff" stroke="#23201f" stroke-width="1.3"/>
<text x="226" y="480" font-size="13" text-anchor="middle" fill="#23201f" font-weight="bold">why the steps still happen in order</text>
<text x="226" y="499" font-size="11" text-anchor="middle" fill="#23201f">Payment subscribes to inventory.reserved and never</text>
<text x="226" y="515" font-size="11" text-anchor="middle" fill="#23201f">to order.placed, so payment cannot be taken for</text>
<text x="226" y="531" font-size="11" text-anchor="middle" fill="#23201f">stock that was never held. The sequence is a</text>
<text x="226" y="547" font-size="11" text-anchor="middle" fill="#23201f">property of who subscribes to what.</text>
<rect x="452" y="458" width="404" height="110" rx="2" fill="#f0f3e4" stroke="#55611f" stroke-width="1.3"/>
<text x="654" y="480" font-size="13" text-anchor="middle" fill="#55611f" font-weight="bold">why a repeat changes nothing</text>
<text x="654" y="499" font-size="11" text-anchor="middle" fill="#23201f">A publish carries the event ID as Nats-Msg-Id, which</text>
<text x="654" y="514" font-size="11" text-anchor="middle" fill="#23201f">JetStream drops inside a two-minute window. Each</text>
<text x="654" y="529" font-size="11" text-anchor="middle" fill="#23201f">consumer then claims the event ID once in its own</text>
<text x="654" y="544" font-size="11" text-anchor="middle" fill="#23201f">store, and an event that does not fit the current</text>
<text x="654" y="559" font-size="11" text-anchor="middle" fill="#23201f">state is logged and dropped.</text>
</svg>
