<text x="432" y="245" font-size="14" text-anchor="middle" fill="#1f6f5c" font-weight="bold">NATS JetStream — one server, one stream, four durable consumers</text>
<text x="432" y="263" font-size="11" text-anchor="middle" fill="#75706c">client :4322 · monitoring :8322 · file storage, 30-day retention</text>
<rect x="32" y="298" width="390" height="104" rx="2" fill="#f0f3e4" stroke="#55611f" stroke-width="1.4"/>
<text x="227" y="320" font-size="13" text-anchor="middle" fill="#55611f" font-weight="bold">what the prototype proves</text>
<text x="227" y="339" font-size="11" text-anchor="middle" fill="#23201f">checkout answers in ~5 ms and still answers 201</text>
<text x="227" y="354" font-size="11" text-anchor="middle" fill="#23201f">while Notification is stopped</text>
<text x="227" y="369" font-size="11" text-anchor="middle" fill="#23201f">the hold is released when payment is declined</text>
<text x="227" y="384" font-size="11" text-anchor="middle" fill="#23201f">one correlation ID runs through all four services</text>
<rect x="442" y="298" width="390" height="104" rx="2" fill="#fdf2f5" stroke="#8a2846" stroke-width="1.4"/>
<text x="637" y="320" font-size="13" text-anchor="middle" fill="#8a2846" font-weight="bold">what it does not prove</text>
<text x="637" y="339" font-size="11" text-anchor="middle" fill="#23201f">one NATS node, replica count 1</text>
<text x="637" y="354" font-size="11" text-anchor="middle" fill="#23201f">no gateway, no API keys, no legacy core</text>
<text x="637" y="369" font-size="11" text-anchor="middle" fill="#23201f">a stubbed card provider</text>
<text x="637" y="384" font-size="11" text-anchor="middle" fill="#23201f">no load test: 5 ms is one request, not peak traffic</text>
