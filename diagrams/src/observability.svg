<text x="440.0" y="153" font-size="11.5" text-anchor="middle" fill="#75706c">batches · samples · strips names, addresses and card data before anything leaves the cluster</text>
<rect x="176" y="190" width="528" height="62" rx="2" fill="#f4f2ef" stroke="#23201f" stroke-width="1.6"/>
<text x="440" y="214" font-size="14.5" text-anchor="middle" fill="#23201f" font-weight="bold">SigNoz — self-hosted, ClickHouse-backed, OpenTelemetry-native</text>
<text x="440" y="234" font-size="11.5" text-anchor="middle" fill="#75706c">logs 30 days · metrics 13 months · traces 15 days — all three joined by correlation_id</text>
<line x1="440" y1="160" x2="440" y2="188" stroke="#a2560d" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="24" y="286" width="404" height="130" rx="2" fill="#fdf2f5" stroke="#8a2846" stroke-width="1.5"/>
<text x="226" y="308" font-size="14" text-anchor="middle" fill="#8a2846" font-weight="bold">SLO: checkout</text>
<text x="226" y="328" font-size="11.5" text-anchor="middle" fill="#23201f">99.9 % of POST /orders answer 2xx in ≤ 900 ms,</text>
<text x="226" y="344" font-size="11.5" text-anchor="middle" fill="#23201f">measured over a rolling 30 days</text>
<text x="226" y="360" font-size="11.5" text-anchor="middle" fill="#23201f">error budget: 43 min 12 s a month</text>
<line x1="40" y1="382" x2="412" y2="382" stroke="#8a2846" stroke-width="1.0" stroke-dasharray="6 4"/>
<text x="226" y="398" font-size="11" text-anchor="middle" fill="#23201f">alert 1  burn 14.4× over 5 min → severity 1, page</text>
<text x="226" y="413" font-size="11" text-anchor="middle" fill="#23201f">alert 2  burn 6× over 1 h → severity 2, Slack</text>
<rect x="452" y="286" width="404" height="130" rx="2" fill="#ffffff" stroke="#23201f" stroke-width="1.4"/>
<text x="654" y="308" font-size="13.5" text-anchor="middle" fill="#23201f" font-weight="bold">what the March incident would have looked like</text>
<text x="654" y="328.0" font-size="11" text-anchor="middle" fill="#23201f">1  memory of notification-service climbs; alert 2 fires</text>
<text x="654" y="343.5" font-size="11" text-anchor="middle" fill="#23201f">2  the service restarts; checkout is untouched</text>
<text x="654" y="359.0" font-size="11" text-anchor="middle" fill="#23201f">3  the engineer filters by service, not by guesswork</text>
<text x="654" y="374.5" font-size="11" text-anchor="middle" fill="#23201f">4  one correlation ID shows the order completed anyway</text>
<text x="654" y="390.0" font-size="11" text-anchor="middle" fill="#23201f">5  the unsent e-mails are still on the stream</text>
<line x1="300" y1="252" x2="226" y2="284" stroke="#23201f" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<line x1="580" y1="252" x2="654" y2="284" stroke="#23201f" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
