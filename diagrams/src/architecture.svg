<line x1="735" y1="56" x2="720" y2="84" stroke="#23201f" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<rect x="24" y="84" width="832" height="56" rx="2" fill="#fbf0e4" stroke="#a2560d" stroke-width="1.6"/>
<text x="440.0" y="108" font-size="15" text-anchor="middle" fill="#a2560d" font-weight="bold">Edge gateway</text>
<text x="440.0" y="127" font-size="11.5" text-anchor="middle" fill="#75706c">TLS · routing · per-retailer API key and scope · rate limit 60 req/min per partner · customer sessions</text>
<rect x="24" y="172" width="500" height="122" rx="2" fill="#fdf2f5" stroke="#8a2846" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="274" y="191" font-size="12" text-anchor="middle" fill="#8a2846" font-style="italic">extracted first — the hot path, and only the hot path</text>
