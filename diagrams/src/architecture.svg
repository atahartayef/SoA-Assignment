<path d="M374,244 v14 a9.0,4 0 0 0 18,0 v-14" fill="white" stroke="#23201f" stroke-width="1.2"/><ellipse cx="383.0" cy="244" rx="9.0" ry="4" fill="white" stroke="#23201f" stroke-width="1.2"/>
