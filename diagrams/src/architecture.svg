<text x="445.0" y="49.5" font-size="11.5" text-anchor="middle" fill="#23201f">iOS / Android</text>
<line x1="445" y1="56" x2="440" y2="84" stroke="#23201f" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
