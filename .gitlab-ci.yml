# MaltaShop lean platform pipeline.
#
# A commit on main is tested, built once into four images, scanned, and - if
# every gate is green - deployed straight to production with a rolling update.
# This is continuous deployment, with one exception: the payment service waits
# for a human. The pipeline is a DAG (`needs:`), not a sequence of stages, so a
# job starts the moment its own inputs are ready.
stages: [verify, build, integration, scan, release]

variables:
  GO_VERSION: "1.23.3"
  DOCKER_BUILDKIT: "1"
  IMAGE_BASE: $CI_REGISTRY_IMAGE
  # The commit SHA is the only tag that is ever deployed. ":latest" is never used,
  # because it points at a different image tomorrow.
  TAG: $CI_COMMIT_SHA

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

# ------------------------------------------------------------------- verify
lint:
  stage: verify
  image: golangci/golangci-lint:v1.61-alpine
  script:
    - gofmt -l . | tee /dev/stderr | wc -l | grep -qx 0
    - golangci-lint run --timeout 5m
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths: [.cache/go-build, .cache/go-mod]

unit-and-contract-tests:
  stage: verify
  image: golang:$GO_VERSION
  script:
    - go test ./... -race -coverprofile=coverage.out
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report: {coverage_format: cobertura, path: coverage.xml}
    expire_in: 1 week

# -------------------------------------------------------------------- build
# One job per service, all four from the same Dockerfile. The image is built
# once here and never rebuilt: later stages refer to it by digest.
build-images:
  stage: build
  needs: [lint, unit-and-contract-tests]
  image: docker:27.3-cli
  services: [docker:27.3-dind]
  parallel:
    matrix:
      - SERVICE: [order, inventory, payment, notification]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg SERVICE=$SERVICE -t $IMAGE_BASE/$SERVICE:$TAG .
    - docker push $IMAGE_BASE/$SERVICE:$TAG
    - docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_BASE/$SERVICE:$TAG > digest-$SERVICE.txt
  artifacts:
    paths: [digest-*.txt]      # the digests every later stage deploys by
    expire_in: 1 month

# -------------------------------------------------------------- integration
compose-integration:
  stage: integration
  needs: [build-images]
  image: docker:27.3-cli
  services: [docker:27.3-dind]
  script:
    - apk add --no-cache bash curl jq util-linux
    - docker compose up --build -d --wait
    - ./scripts/smoke_test.sh
  after_script:
    - docker compose logs --no-color --tail 300
    - docker compose down -v

# --------------------------------------------------------------------- scan
image-scan:
  stage: scan
  needs: [build-images]
  image: aquasec/trivy:0.56.2
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed $IMAGE_BASE/order:$TAG
  allow_failure: false

secret-scan:
  stage: scan
  needs: []
  image: zricethezav/gitleaks:v8.21.2
  script: [gitleaks detect --no-banner --redact]

# ------------------------------------------------------------------ release
# Continuous deployment: three of the four services go to production on green.
deploy-services:
  stage: release
  needs: [compose-integration, image-scan, secret-scan]
  image: amazon/aws-cli:2.18.9
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  parallel:
    matrix:
      - SERVICE: [order, inventory, notification]
  environment:
    name: production/$SERVICE
    url: https://www.maltashop.mt
  script:
    # A rolling update: new tasks start, pass their readiness probe, and only
    # then are old tasks drained. No second environment, no traffic splitting.
    - ./scripts/deploy.sh "$SERVICE" "$(cat digest-$SERVICE.txt)"
    - ./scripts/watch_rollout.sh "$SERVICE" --window 10m --max-error-rate 1.0

# Payment is the one service a person still releases, because a bad payment
# release costs money rather than time.
deploy-payment:
  stage: release
  needs: [deploy-services]
  image: amazon/aws-cli:2.18.9
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false
  environment:
    name: production/payment
    url: https://www.maltashop.mt
  script:
    - ./scripts/deploy.sh payment "$(cat digest-payment.txt)"
    - ./scripts/watch_rollout.sh payment --window 15m --max-error-rate 0.5
